<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Контакты</title>
  <link rel="stylesheet" href="../css/import.css">
</head>
<body>

  <header class="header">
      <div class="logo">
            <a href="http://localhost:8000/"><img src="../../assets/logo.png" alt="Логотип"></a> 
        </div>
      <p class="wineshop">Винный магазин</p>
      <div class="place flex-center flex-row">
          <div class="img-place">
              <img src="../../assets/place.png" alt="Местоположение">
          </div>
          <div class="flex-column">
              <p class="my_font">г. Санкт-Петербург,</p>
              <p class="my_font">ул. Куйбышева 31</p>
          </div>
      </div>
      <div class="contacts flex-center flex-row">
          <a href="/public/html/user.html"><img src="../../assets/profile.png" alt="Профиль" class="profile"></a>
          <a href="#"><img src="../../assets/basket.png" alt="Корзина" class="basket"></a>
      </div>
  </header>

  <h1>Контакты</h1>
  <div class="container_con">
    <section class="section_con">
      <h2>Свяжитесь с нами</h2>
      <form class="contact-form">
        <label for="name">Имя</label>
        <input type="text" id="name" name="name" placeholder="Ваше имя" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Ваш email" required />

        <label for="message">Сообщение</label>
        <textarea id="message" name="message" rows="5" placeholder="Ваше сообщение" required></textarea>

        <button type="submit">Отправить</button>
      </form>
    </section>

    <section class="section_con">
      <h2>Наши контакты</h2>
      <p><strong>Адрес:</strong> ул. Щедрина 43, Рязань</p>
      <p><strong>Телефон:</strong> +7(920)999-46-56</p>
      <p><strong>Email:</strong> rzn@top-academy.ru</p>
    </section>
  </div>

  <footer>© 2025 Все права защищены.</footer>
</body>
</html>
